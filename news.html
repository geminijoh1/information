<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>전체 기록 아카이브 - 개인 아카이브</title>
  <link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif'],
          },
          colors: { brand: { red: '#E01E26' } }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #111827;
      background-color: #ffffff;
    }
    html { scroll-behavior: smooth; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
  </style>
</head>
<body class="min-h-screen bg-white text-gray-900 flex flex-col">
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200">
    <div class="max-w-[1536px] mx-auto px-6 h-14 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3 shrink-0">
        <a class="flex items-center space-x-2 text-gray-900 font-bold text-base tracking-tight hover:text-red-600 transition-colors" href="index.html">
          <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>개인 아카이브</span>
        </a>
      </div>

      <div class="flex items-center space-x-4 text-[13px] font-medium text-gray-600">
        <nav class="hidden lg:flex items-center space-x-5">
          <a class="hover:text-red-600 transition-colors" href="index.html">홈</a>
          <a class="text-red-600 font-semibold" href="news.html">전체 기록</a>
          <a class="hover:text-red-600 transition-colors" href="admin.html">관리자</a>
        </nav>
        <div class="flex items-center space-x-2">
          <button onclick="openQuickWriteModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-sm transition-all min-h-[44px]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>페이지 추가</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="flex-1 max-w-[1536px] w-full mx-auto px-6 flex justify-between">
    <!-- 노션 스타일 좌측 사이드바 (계층형 폴더 하위 트리) -->
    <aside class="w-64 shrink-0 sticky top-14 h-[calc(100vh-3.5rem)] overflow-y-auto py-6 pr-5 border-r border-gray-100 hidden md:block select-none text-[13px]">
      <div class="flex flex-col justify-between h-full">
        <div class="space-y-4">
          <!-- Notion Header -->
          <div class="flex items-center justify-between px-2 py-1.5 rounded-lg bg-gray-50/80 hover:bg-gray-100 text-gray-700 transition-colors">
            <div class="flex items-center gap-1.5 font-bold text-xs text-gray-800 cursor-pointer" onclick="selectCategory('all')">
              <span>개인 페이지</span>
              <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
            </div>
            <div class="flex items-center gap-0.5 text-gray-400">
              <a href="news.html" title="아카이브 전체보기" class="p-1 hover:text-gray-700 rounded hover:bg-gray-200/60 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M7 17l10-10M7 7h10v10"></path></svg>
              </a>
              <button onclick="openNewFolderModal()" title="신규 폴더(카테고리) 추가" class="p-1 text-gray-500 hover:text-red-600 rounded hover:bg-red-50 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
              <button onclick="location.href='admin.html'" title="관리자 설정" class="p-1 hover:text-gray-700 rounded hover:bg-gray-200/60 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
              </button>
            </div>
          </div>

          <a href="index.html" class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-100 transition-colors">
            <span class="text-sm">🏠</span>홈 / 소개
          </a>

          <!-- 계층형 동적 폴더 & 문서 트리 -->
          <div id="sidebar-folder-tree" class="space-y-3 pt-1">
            <div class="text-[11px] text-gray-400 px-2 py-1">폴더 목록을 불러오는 중...</div>
          </div>
        </div>

        <div class="pt-4 border-t border-gray-100">
          <button onclick="openNewFolderModal()" class="w-full flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-gray-700 bg-gray-50 hover:bg-gray-100 rounded-lg border border-gray-200 transition-all group">
            <svg class="w-3.5 h-3.5 text-red-500 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>새 폴더(카테고리) 추가</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 중앙 본문 목록 영역 -->
    <main class="flex-1 max-w-[800px] py-8 px-0 lg:px-8">
      <div class="space-y-6">
        <div>
          <nav class="flex items-center space-x-2 text-xs text-gray-500 font-medium mb-2">
            <a href="index.html" class="hover:text-gray-800">홈</a>
            <svg class="w-3 h-3 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
            <span id="breadcrumb-cat" class="text-red-600 font-semibold">전체 기록</span>
          </nav>
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
              <h1 id="page-heading" class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">기록 보관소</h1>
              <p class="text-xs text-gray-500 mt-0.5">상위 카테고리별로 체계화된 지식 페이지들을 탐색합니다.</p>
            </div>
            <button onclick="openQuickWriteModal()" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-sm transition-all self-start sm:self-auto min-h-[40px]">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              새 페이지 작성
            </button>
          </div>
        </div>

        <div class="relative">
          <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input id="search-input" class="w-full pl-10 pr-4 py-2.5 text-sm bg-gray-50 hover:bg-gray-100/70 focus:bg-white text-gray-900 rounded-xl border border-gray-200 focus:border-red-500 focus:ring-2 focus:ring-red-100 transition-all outline-none" placeholder="제목, 키워드, 내용으로 검색..." type="text"/>
        </div>

        <!-- 카테고리 필터 탭 -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
          <button onclick="selectCategory('all', this)" class="cat-pill active px-3 py-1.5 rounded-full font-bold bg-red-600 text-white transition-all">전체보기</button>
          <button onclick="selectCategory('전략', this)" class="cat-pill px-3 py-1.5 rounded-full text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all">📚 콘텐츠 위키</button>
          <button onclick="selectCategory('기술', this)" class="cat-pill px-3 py-1.5 rounded-full text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all">📕 업무 &amp; 분석</button>
          <button onclick="selectCategory('개발', this)" class="cat-pill px-3 py-1.5 rounded-full text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all">💻 개발 &amp; 구조</button>
        </div>

        <div id="news-list" class="space-y-3 pt-1">
          <div class="text-center py-12 text-gray-400 text-sm">기록을 불러오는 중입니다...</div>
        </div>

        <footer class="pt-10 pb-16 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between text-xs text-gray-400 gap-3">
          <div>&copy; 2026 Personal Knowledge Base.</div>
          <div class="flex items-center space-x-4">
            <a href="index.html" class="hover:text-gray-600 py-2">홈으로</a>
            <a href="admin.html" class="hover:text-red-600 py-2 font-medium">관리자 콘솔</a>
          </div>
        </footer>
      </div>
    </main>

    <!-- 우측 날개 (Right Wing & 빠른 스크롤 정리) -->
    <aside class="w-56 shrink-0 sticky top-14 h-[calc(100vh-3.5rem)] py-6 pl-5 border-l border-gray-100 hidden lg:block select-none text-[13px]">
      <div class="space-y-6">
        <div class="space-y-2.5">
          <h4 class="text-xs font-bold text-gray-900 uppercase tracking-wider flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect><line x1="3" x2="21" y1="9" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            아카이브 현황
          </h4>
          <div class="p-3.5 rounded-xl bg-gray-50 border border-gray-200/80 space-y-2 text-xs">
            <div class="flex items-center justify-between text-gray-600">
              <span>총 누적 기록</span>
              <span id="right-total-count" class="font-bold text-gray-900">0건</span>
            </div>
            <div class="flex items-center justify-between text-gray-600">
              <span>선택 카테고리</span>
              <span id="right-cat-name" class="font-medium text-red-600">전체</span>
            </div>
          </div>
        </div>

        <!-- 긴 페이지 스크롤 빠른 네비게이션 -->
        <div class="space-y-2 pt-2 border-t border-gray-100">
          <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block">페이지 정리 스크롤</span>
          <div class="space-y-1 text-xs text-gray-600">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-gray-100 flex items-center justify-between transition-colors">
              <span>🔝 맨 위로</span>
            </button>
            <button onclick="document.getElementById('search-input').scrollIntoView({behavior: 'smooth'})" class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-gray-100 flex items-center justify-between transition-colors">
              <span>🔍 검색창으로</span>
            </button>
            <button onclick="document.getElementById('news-list').scrollIntoView({behavior: 'smooth'})" class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-gray-100 flex items-center justify-between transition-colors">
              <span>📑 목록 시작점</span>
            </button>
          </div>
        </div>

        <div class="pt-4 border-t border-gray-100 space-y-2">
          <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block">빠른 작업</span>
          <button onclick="openQuickWriteModal()" class="flex items-center justify-center gap-2 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 w-full px-3 py-2.5 rounded-xl transition-all shadow-sm">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            새 페이지 추가 (+)
          </button>
          <a href="admin.html" class="flex items-center gap-2 text-xs text-gray-600 hover:text-gray-900 w-full px-2 py-1.5 rounded-lg hover:bg-gray-100 transition-colors">
            <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            관리자 대시보드
          </a>
        </div>
      </div>
    </aside>
  </div>

  <!-- 즉시 새 페이지 작성 모달 -->
  <div id="quick-write-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-gray-200 shadow-2xl max-w-lg w-full p-6 space-y-4 animate-in fade-in zoom-in-95 duration-200">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-base">📄</span>
          <h3 class="text-base font-bold text-gray-900">새 페이지 추가</h3>
        </div>
        <button onclick="closeQuickWriteModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-gray-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">제목</label>
          <input id="modal-title" type="text" class="w-full px-3.5 py-2 text-sm bg-gray-50 focus:bg-white rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none" placeholder="페이지 제목을 입력하세요"/>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">카테고리 (폴더)</label>
            <select id="modal-cat" class="w-full px-3 py-2 text-xs bg-gray-50 focus:bg-white rounded-xl border border-gray-200 focus:border-red-500 outline-none">
              <option value="전략">📚 콘텐츠 위키</option>
              <option value="기술">📕 업무 &amp; 분석</option>
              <option value="개발">💻 개발 &amp; 구조</option>
              <option value="기타">💡 기타 &amp; 아이디어</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">작성일</label>
            <input id="modal-date" type="date" class="w-full px-3 py-2 text-xs bg-gray-50 focus:bg-white rounded-xl border border-gray-200 focus:border-red-500 outline-none"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">본문 내용 (마크다운)</label>
          <textarea id="modal-content" rows="6" class="w-full px-3.5 py-2 text-xs font-mono bg-gray-50 focus:bg-white rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none" placeholder="여기에 메모나 기록할 내용을 자유롭게 적으세요..."></textarea>
        </div>
      </div>

      <div id="modal-status" class="hidden text-xs font-medium p-2.5 rounded-lg"></div>

      <div class="flex items-center justify-between pt-2">
        <a href="news-write.html" class="text-xs text-gray-500 hover:text-gray-800 underline">상세 에디터로 작성하기</a>
        <div class="flex items-center gap-2">
          <button type="button" onclick="closeQuickWriteModal()" class="px-3 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg">취소</button>
          <button id="modal-submit-btn" type="button" onclick="submitQuickPage()" class="px-4 py-2 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-sm">페이지 생성</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 신규 폴더 생성 모달 (New Folder Modal) -->
  <div id="new-folder-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-gray-200 shadow-2xl max-w-md w-full p-6 space-y-4 animate-in fade-in zoom-in-95 duration-200">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-base">📁</span>
          <h3 class="text-base font-bold text-gray-900">새 폴더(카테고리) 추가</h3>
        </div>
        <button onclick="closeNewFolderModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-gray-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">폴더 이름</label>
          <input id="new-folder-name" type="text" class="w-full px-3.5 py-2 text-sm bg-gray-50 focus:bg-white rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none" placeholder="예: 마케팅 전략, 독서 노트, 데이터 분석" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">이모지 / 아이콘 선택</label>
          <div class="flex flex-wrap gap-1.5 mb-2">
            <button type="button" onclick="selectFolderEmoji('📁')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">📁</button>
            <button type="button" onclick="selectFolderEmoji('📚')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">📚</button>
            <button type="button" onclick="selectFolderEmoji('🚀')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">🚀</button>
            <button type="button" onclick="selectFolderEmoji('📊')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">📊</button>
            <button type="button" onclick="selectFolderEmoji('🎯')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">🎯</button>
            <button type="button" onclick="selectFolderEmoji('💻')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">💻</button>
            <button type="button" onclick="selectFolderEmoji('💡')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">💡</button>
            <button type="button" onclick="selectFolderEmoji('📝')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">📝</button>
            <button type="button" onclick="selectFolderEmoji('🛠️')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">🛠️</button>
            <button type="button" onclick="selectFolderEmoji('🏷️')" class="folder-emoji-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm flex items-center justify-center border border-gray-200">🏷️</button>
          </div>
          <input id="new-folder-emoji" type="text" class="w-20 px-3 py-1.5 text-center text-sm bg-gray-50 focus:bg-white rounded-lg border border-gray-200 focus:border-red-500 outline-none" value="📁" />
        </div>
      </div>

      <div id="new-folder-status" class="hidden text-xs font-medium p-2.5 rounded-lg"></div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100">
        <button type="button" onclick="closeNewFolderModal()" class="px-3 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg">취소</button>
        <button id="new-folder-submit-btn" type="button" onclick="submitNewFolder()" class="px-4 py-2 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-sm">폴더 생성하기</button>
      </div>
    </div>
  </div>

  <script src="auth_local.js"></script>
  <script src="db.js"></script>
  <script>
    let allPosts = [];
    let currentCategory = 'all';

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function toggleFolder(folderId) {
      const el = document.getElementById(folderId);
      const arrow = document.getElementById(folderId + '-arrow');
      if (!el) return;
      el.classList.toggle('hidden');
      if (arrow) arrow.classList.toggle('rotate-90');
    }

    async function populateCategoryOptions() {
      const catSelect = document.getElementById('modal-cat');
      if (!catSelect) return;
      const categories = await getCategories();
      catSelect.innerHTML = categories.map(c => `
        <option value="${escapeHtml(c.code)}">${escapeHtml(c.emoji || '📁')} ${escapeHtml(c.name)}</option>
      `).join('');
    }

    function openNewFolderModal() {
      document.getElementById('new-folder-name').value = '';
      document.getElementById('new-folder-emoji').value = '📁';
      document.getElementById('new-folder-status').className = 'hidden';
      document.getElementById('new-folder-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('new-folder-name').focus(), 50);
    }

    function closeNewFolderModal() {
      document.getElementById('new-folder-modal').classList.add('hidden');
    }

    function selectFolderEmoji(emoji) {
      document.getElementById('new-folder-emoji').value = emoji;
    }

    async function submitNewFolder() {
      const name = document.getElementById('new-folder-name').value.trim();
      const emoji = document.getElementById('new-folder-emoji').value.trim() || '📁';
      const statusEl = document.getElementById('new-folder-status');
      const btn = document.getElementById('new-folder-submit-btn');

      if (!name) {
        alert('폴더 이름을 입력해 주세요.');
        document.getElementById('new-folder-name').focus();
        return;
      }

      btn.disabled = true;
      btn.innerText = '생성 중...';
      statusEl.className = 'text-xs font-medium p-2.5 rounded-lg bg-blue-50 text-blue-700 block';
      statusEl.innerText = '신규 폴더를 생성하고 저장소에 동기화 중입니다...';

      try {
        const newCat = {
          id: 'folder-' + Date.now(),
          code: name,
          name: name,
          emoji: emoji
        };
        await saveCategory(newCat);
        statusEl.className = 'text-xs font-medium p-2.5 rounded-lg bg-emerald-50 text-emerald-700 block';
        statusEl.innerText = `"${name}" 폴더가 성공적으로 추가되었습니다!`;

        allPosts = await getPosts();
        await renderHierarchicalTree(allPosts);
        await populateCategoryOptions();
        await renderCategoryPills();

        setTimeout(() => {
          closeNewFolderModal();
          btn.disabled = false;
          btn.innerText = '폴더 생성하기';
        }, 500);
      } catch (err) {
        btn.disabled = false;
        btn.innerText = '폴더 생성하기';
        statusEl.className = 'text-xs font-medium p-2.5 rounded-lg bg-red-50 text-red-700 block';
        statusEl.innerText = '생성 실패: ' + err.message;
      }
    }

    async function renderCategoryPills() {
      const container = document.getElementById('category-pills');
      if (!container) return;
      const categories = await getCategories();
      let html = `<button onclick="selectCategory('all', this)" class="cat-pill active px-3 py-1.5 rounded-full font-bold bg-red-600 text-white transition-all">전체보기</button>`;
      categories.forEach(c => {
        html += `<button onclick="selectCategory('${escapeHtml(c.code)}', this)" class="cat-pill px-3 py-1.5 rounded-full text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all">${escapeHtml(c.emoji || '📁')} ${escapeHtml(c.name)}</button>`;
      });
      container.innerHTML = html;
    }

    async function renderHierarchicalTree(posts, activeId) {
      const treeContainer = document.getElementById('sidebar-folder-tree');
      if (!treeContainer) return;
      const categories = await getCategories();

      const rightTotal = document.getElementById('right-total-count');
      if (rightTotal) rightTotal.innerText = `${posts.length}건`;

      treeContainer.innerHTML = categories.map(cat => {
        const folderDomId = 'folder-' + (cat.id || cat.code);
        const catPosts = posts.filter(p => p.category === cat.code || p.category === cat.name);

        const itemsHtml = catPosts.length === 0
          ? '<div class="text-[11px] text-gray-400 py-0.5">글이 없습니다</div>'
          : catPosts.map(p => {
              const isActive = p.id === activeId;
              const activeClass = isActive
                ? 'bg-red-50 text-red-600 font-semibold border-l-2 border-red-600'
                : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900';
              return `
                <a href="news-detail.html?id=${p.id}" class="flex items-center gap-1.5 px-2 py-1 rounded text-xs transition-colors truncate ${activeClass}">
                  <span class="text-xs">📄</span>
                  <span class="truncate">${escapeHtml(p.title)}</span>
                </a>
              `;
            }).join('');

        return `
          <div>
            <div class="flex items-center justify-between px-2 py-1 text-xs font-bold text-gray-800 hover:bg-gray-100/70 rounded-md cursor-pointer" onclick="toggleFolder('${folderDomId}')">
              <span class="flex items-center gap-1.5 truncate">
                <svg id="${folderDomId}-arrow" class="w-3 h-3 text-gray-400 transition-transform duration-200 rotate-90 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                <span onclick="event.stopPropagation(); selectCategory('${escapeHtml(cat.code)}')" class="truncate hover:text-red-600 transition-colors">${escapeHtml(cat.emoji || '📁')} ${escapeHtml(cat.name)}</span>
              </span>
              <span class="text-[10px] text-gray-400 font-mono shrink-0 ml-1">${catPosts.length}</span>
            </div>
            <div id="${folderDomId}" class="pl-3 pr-1 mt-0.5 space-y-0.5">${itemsHtml}</div>
          </div>
        `;
      }).join('');
    }

    function renderList(posts) {
      const container = document.getElementById('news-list');

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-gray-50/50 rounded-2xl border border-dashed border-gray-200">
            <div class="text-2xl mb-2">📑</div>
            <p class="text-sm font-medium text-gray-500">일치하는 페이지가 없습니다.</p>
            <button onclick="openQuickWriteModal()" class="mt-3 text-xs font-semibold text-red-600 hover:underline">+ 새 페이지 만들기</button>
          </div>
        `;
        return;
      }

      container.innerHTML = posts.map(post => {
        const summary = post.summary || markdownToText(post.content).slice(0, 100) + '...';
        return `
          <a href="news-detail.html?id=${post.id}" class="group block p-4 sm:p-5 rounded-xl border border-gray-200/90 hover:border-red-300 hover:bg-gradient-to-br hover:from-white hover:to-red-50/20 hover:shadow-sm transition-all duration-200">
            <div class="flex items-start justify-between gap-4">
              <div class="space-y-1.5 flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-red-50 text-red-600 border border-red-100">${escapeHtml(post.category || '기록')}</span>
                  <span class="text-xs text-gray-400 font-mono">${escapeHtml(post.date || '')}</span>
                </div>
                <h2 class="text-base sm:text-lg font-bold text-gray-900 group-hover:text-red-600 transition-colors leading-snug">${escapeHtml(post.title)}</h2>
                <p class="text-xs sm:text-sm text-gray-600 line-clamp-2 leading-relaxed">${escapeHtml(summary)}</p>
              </div>
              <span class="text-gray-400 group-hover:text-red-600 group-hover:translate-x-0.5 transition-all text-sm leading-none pt-1">↗</span>
            </div>
          </a>
        `;
      }).join('');
    }

    function filterPosts() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      let filtered = allPosts.filter(p => {
        const matchCat = (currentCategory === 'all' || p.category === currentCategory);
        const matchQuery = !q || (
          (p.title && p.title.toLowerCase().includes(q)) ||
          (p.summary && p.summary.toLowerCase().includes(q)) ||
          (p.content && p.content.toLowerCase().includes(q)) ||
          (p.category && p.category.toLowerCase().includes(q))
        );
        return matchCat && matchQuery;
      });
      renderList(filtered);
    }

    function selectCategory(cat, btn) {
      currentCategory = cat;
      const catNames = { all: '전체', '전략': '콘텐츠 위키', '기술': '업무 & 분석', '개발': '개발 & 구조', '기타': '기타' };
      document.getElementById('right-cat-name').innerText = catNames[cat] || cat;
      document.getElementById('breadcrumb-cat').innerText = catNames[cat] || cat;

      document.querySelectorAll('.cat-pill').forEach(b => {
        b.className = "cat-pill px-3 py-1.5 rounded-full text-gray-600 bg-gray-100 hover:bg-gray-200 transition-all";
      });
      if (btn) {
        btn.className = "cat-pill active px-3 py-1.5 rounded-full font-bold bg-red-600 text-white transition-all";
      }
      filterPosts();
    }

    function openQuickWriteModal() {
      document.getElementById('modal-date').value = getTodayStr();
      document.getElementById('modal-title').value = '';
      document.getElementById('modal-content').value = '';
      document.getElementById('modal-status').className = 'hidden';
      document.getElementById('quick-write-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modal-title').focus(), 50);
    }

    function closeQuickWriteModal() {
      document.getElementById('quick-write-modal').classList.add('hidden');
    }

    async function submitQuickPage() {
      const title = document.getElementById('modal-title').value.trim();
      const cat = document.getElementById('modal-cat').value;
      const date = document.getElementById('modal-date').value;
      const content = document.getElementById('modal-content').value.trim();
      const statusEl = document.getElementById('modal-status');
      const submitBtn = document.getElementById('modal-submit-btn');

      if (!title) {
        alert('제목을 입력해 주세요.');
        document.getElementById('modal-title').focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '저장 중...';
      statusEl.className = 'text-xs font-medium p-2.5 rounded-lg bg-blue-50 text-blue-700 block';
      statusEl.innerText = 'GitHub 저장소에 동기화 저장 중입니다...';

      const newPost = {
        title,
        category: cat,
        date: date || getTodayStr(),
        author: '',
        summary: markdownToText(content).slice(0, 80) || '새로 작성된 페이지입니다.',
        content: content || '## ' + title + '\n\n내용을 작성하세요.'
      };

      try {
        const saved = await savePost(newPost);
        statusEl.className = 'text-xs font-medium p-2.5 rounded-lg bg-emerald-50 text-emerald-700 block';
        statusEl.innerText = '성공적으로 저장되었습니다!';
        
        allPosts = await getPosts();
        renderHierarchicalTree(allPosts);
        filterPosts();

        setTimeout(() => {
          closeQuickWriteModal();
          submitBtn.disabled = false;
          submitBtn.innerText = '페이지 생성';
        }, 600);
      } catch (err) {
        console.error(err);
        submitBtn.disabled = false;
        submitBtn.innerText = '페이지 생성';
        statusEl.className = 'text-xs font-medium p-2.5 rounded-lg bg-red-50 text-red-700 block';
        statusEl.innerText = '저장 실패: ' + err.message;
      }
    }

    async function init() {
      try {
        allPosts = await getPosts();
        await populateCategoryOptions();
        await renderCategoryPills();
        await renderHierarchicalTree(allPosts);
        renderList(allPosts);
      } catch (e) {
        document.getElementById('news-list').innerHTML = '<div class="text-sm text-red-500 text-center py-8">기록을 불러오는 중 오류가 발생했습니다.</div>';
      }

      document.getElementById('search-input').addEventListener('input', filterPosts);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
