<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>기록 관리 대시보드 - 바이럴 가이드</title>
  <link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif'],
          },
          colors: { brand: { red: '#E01E26' } }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #111827;
      background-color: #f9fafb;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200">
    <div class="max-w-[1200px] mx-auto px-6 h-14 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3 shrink-0">
        <a class="flex items-center space-x-2 text-gray-900 font-bold text-base tracking-tight hover:text-red-600 transition-colors" href="index.html">
          <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>개인 아카이브</span>
        </a>
      </div>

      <div class="flex items-center space-x-3 text-xs font-medium">
        <a href="index.html" class="px-3 py-1.5 text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-100 transition-colors min-h-[44px] flex items-center">
          홈으로
        </a>
        <a href="news.html" class="px-3 py-1.5 text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-100 transition-colors min-h-[44px] flex items-center">
          기록 목록
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1200px] w-full mx-auto px-4 sm:px-6 py-10">
    <div id="login-section" class="max-w-md mx-auto my-12 bg-white rounded-2xl border border-gray-200 shadow-sm p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mx-auto shadow-sm shadow-red-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h1 class="text-xl font-bold text-gray-900">관리자 로그인</h1>
        <p class="text-xs text-gray-500">기록 작성 및 관리를 위해 관리자 비밀번호를 입력해 주세요.</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-gray-700">비밀번호</label>
          <input id="password-input" type="password" class="w-full px-3.5 py-2.5 text-sm bg-gray-50 focus:bg-white rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition-all" placeholder="관리자 비밀번호 (기본: admin1234)" autofocus/>
        </div>

        <div id="login-error" class="hidden p-3 rounded-xl text-xs font-medium bg-red-50 text-red-600 border border-red-100">
          비밀번호가 올바르지 않습니다.
        </div>

        <button type="submit" class="w-full py-2.5 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-sm transition-all min-h-[44px]">
          로그인
        </button>
      </form>
    </div>

    <div id="dashboard-section" class="hidden space-y-6">
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-gray-900 tracking-tight">내 기록 관리 대시보드</h1>
          <p class="text-xs text-gray-500 mt-1">저장소의 게시글을 생성, 수정, 삭제하고 실시간 동기화 상태를 확인합니다.</p>
        </div>

        <div class="flex items-center space-x-3">
          <a href="news-write.html" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-sm transition-all min-h-[44px]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            새 글 작성
          </a>
          <button id="logout-btn" type="button" class="px-3.5 py-2 text-xs font-semibold text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors min-h-[44px]">
            로그아웃
          </button>
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="p-4 sm:p-6 border-b border-gray-100 flex items-center justify-between">
          <h2 class="text-sm font-bold text-gray-800">전체 기록 목록</h2>
          <span id="dashboard-count" class="text-xs text-gray-400">총 0건</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 text-gray-500 border-b border-gray-100 font-semibold">
              <tr>
                <th class="py-3 px-4 w-16 text-center">번호</th>
                <th class="py-3 px-4 w-24">카테고리</th>
                <th class="py-3 px-4">제목</th>
                <th class="py-3 px-4 w-28">작성일</th>
                <th class="py-3 px-4 w-32 text-center">관리</th>
              </tr>
            </thead>
            <tbody id="posts-table-body" class="divide-y divide-gray-100 text-gray-700">
              <tr>
                <td colspan="5" class="py-8 text-center text-gray-400">기록을 불러오는 중입니다...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-6 border-t border-gray-100 text-center text-xs text-gray-400">
    &copy; 2026 Personal Knowledge Base. Admin Console.
  </footer>

  <script src="db.js"></script>
  <script>
    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('password-input');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');

    async function checkAuthAndRender() {
      if (isAdmin()) {
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        await loadDashboardPosts();
      } else {
        loginSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      const inputPass = passwordInput.value;

      try {
        const cfg = await loadConfig();
        const expected = cfg.admin_password || 'admin1234';
        if (inputPass === expected) {
          sessionStorage.setItem('isAdmin', 'true');
          window.location.reload();
        } else {
          loginError.classList.remove('hidden');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        console.error(err);
        loginError.innerText = '설정 정보를 불러오지 못했습니다.';
        loginError.classList.remove('hidden');
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('isAdmin');
      window.location.reload();
    });

    async function loadDashboardPosts() {
      const tbody = document.getElementById('posts-table-body');
      const countEl = document.getElementById('dashboard-count');
      try {
        const posts = await getPosts();
        countEl.innerText = `총 ${posts.length}건`;

        if (posts.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-gray-400">작성된 기록이 없습니다.</td></tr>`;
          return;
        }

        tbody.innerHTML = posts.map((post, idx) => {
          return `
            <tr class="hover:bg-gray-50/70 transition-colors">
              <td class="py-3 px-4 text-center text-gray-400 font-mono">${idx + 1}</td>
              <td class="py-3 px-4">
                <span class="inline-block px-2 py-0.5 rounded-full bg-red-50 text-red-600 font-medium text-[11px] border border-red-100">${escapeHtml(post.category || '기록')}</span>
              </td>
              <td class="py-3 px-4 font-medium text-gray-900">
                <a href="news-detail.html?id=${post.id}" class="hover:text-red-600 transition-colors line-clamp-1">${escapeHtml(post.title)}</a>
              </td>
              <td class="py-3 px-4 text-gray-400 font-mono text-[11px]">${escapeHtml(post.date || '')}</td>
              <td class="py-3 px-4 text-center">
                <div class="inline-flex items-center space-x-1">
                  <a href="news-write.html?id=${post.id}" class="px-2.5 py-1 text-xs font-semibold text-gray-700 hover:text-gray-900 hover:bg-gray-100 rounded-md transition-colors min-h-[32px] flex items-center">
                    수정
                  </a>
                  <button type="button" onclick="handleDelete('${post.id}')" class="px-2.5 py-1 text-xs font-semibold text-red-600 hover:text-red-700 hover:bg-red-50 rounded-md transition-colors min-h-[32px] flex items-center">
                    삭제
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>`;
      }
    }

    async function handleDelete(id) {
      if (!confirm('이 기록을 정말 삭제하시겠습니까? (GitHub 저장소에서도 즉시 삭제됩니다)')) return;
      try {
        await deletePost(id);
        alert('삭제되었습니다.');
        await loadDashboardPosts();
      } catch (err) {
        alert('삭제 실패: ' + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', checkAuthAndRender);
  </script>
</body>
</html>
