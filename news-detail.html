<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>기록 상세 - 바이럴 가이드</title>
  <link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif'],
          },
          colors: { brand: { red: '#E01E26' } }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #111827;
      background-color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen bg-white text-gray-900 flex flex-col">
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200">
    <div class="max-w-[1536px] mx-auto px-6 h-14 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3 shrink-0">
        <a class="flex items-center space-x-2 text-gray-900 font-bold text-base tracking-tight hover:text-red-600 transition-colors" href="index.html">
          <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>개인 아카이브</span>
        </a>
      </div>

      <div class="flex items-center space-x-3 text-[13px] font-medium text-gray-600">
        <a href="news.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors min-h-[44px]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
          목록으로
        </a>
        <div id="admin-actions" class="hidden items-center space-x-2">
          <a id="edit-btn" href="#" class="px-3 py-1.5 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors min-h-[44px] flex items-center">
            수정
          </a>
          <button id="delete-btn" type="button" class="px-3 py-1.5 text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors min-h-[44px] flex items-center">
            삭제
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[800px] w-full mx-auto px-6 py-10 sm:py-14">
    <div id="loading" class="text-center py-20 text-gray-400 text-sm">기록을 불러오는 중...</div>
    
    <div id="error-box" class="hidden text-center py-20">
      <div class="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
      </div>
      <h2 class="text-base font-bold text-gray-900 mb-1">기록을 찾을 수 없습니다</h2>
      <p class="text-xs text-gray-500 mb-6">삭제되었거나 잘못된 접근입니다.</p>
      <a href="news.html" class="inline-flex items-center px-4 py-2 text-xs font-semibold text-white bg-red-600 rounded-lg">전체 목록으로</a>
    </div>

    <article id="post-content-area" class="hidden space-y-8">
      <div class="space-y-3 border-b border-gray-100 pb-6">
        <div class="flex items-center gap-2">
          <span id="post-category" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-red-50 text-red-600 border border-red-100"></span>
          <span id="post-date" class="text-xs text-gray-400"></span>
          <span class="text-xs text-gray-300">·</span>
          <span id="post-author" class="text-xs text-gray-600 font-medium"></span>
        </div>
        <h1 id="post-title" class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight leading-snug"></h1>
        <p id="post-summary" class="text-sm text-gray-600 bg-gray-50 p-4 rounded-xl border border-gray-100 leading-relaxed"></p>
      </div>

      <div id="post-body" class="text-gray-800 leading-relaxed text-sm sm:text-base"></div>

      <div class="pt-8 border-t border-gray-100 flex items-center justify-between">
        <a href="news.html" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-600 hover:text-gray-900 py-3 min-h-[44px]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><line x1="19" x2="5" y1="12" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          전체 기록 목록
        </a>
        <a href="news-write.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-red-600 hover:text-red-700 py-3 min-h-[44px]">
          새 글 작성 &rarr;
        </a>
      </div>
    </article>
  </main>

  <footer class="py-8 border-t border-gray-100 text-center text-xs text-gray-400">
    &copy; 2026 Personal Knowledge Base. All rights reserved.
  </footer>

  <script src="auth_local.js"></script>
  <script src="db.js"></script>
  <script>
    async function initDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');

      if (!postId) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error-box').classList.remove('hidden');
        return;
      }

      if (isAdmin()) {
        const adminActions = document.getElementById('admin-actions');
        adminActions.classList.remove('hidden');
        adminActions.classList.add('flex');
        document.getElementById('edit-btn').href = `news-write.html?id=${postId}`;
        document.getElementById('delete-btn').addEventListener('click', async () => {
          if (confirm('이 기록을 정말 삭제하시겠습니까? (GitHub 저장소에서도 함께 삭제됩니다)')) {
            try {
              document.getElementById('delete-btn').innerText = '삭제 중...';
              document.getElementById('delete-btn').disabled = true;
              await deletePost(postId);
              alert('삭제가 완료되었습니다.');
              window.location.href = 'news.html';
            } catch (err) {
              alert('삭제 실패: ' + err.message);
              document.getElementById('delete-btn').innerText = '삭제';
              document.getElementById('delete-btn').disabled = false;
            }
          }
        });
      }

      try {
        const posts = await getPosts();
        const post = posts.find(p => p.id === postId);

        document.getElementById('loading').classList.add('hidden');

        if (!post) {
          document.getElementById('error-box').classList.remove('hidden');
          return;
        }

        document.getElementById('post-title').innerText = post.title || '';
        document.title = (post.title || '기록 상세') + ' - 바이럴 가이드';
        document.getElementById('post-category').innerText = post.category || '기록';
        document.getElementById('post-date').innerText = post.date || '';
        if (post.author) {
          document.getElementById('post-author').innerText = post.author;
        } else {
          document.getElementById('post-author').classList.add('hidden');
        }

        if (post.summary) {
          document.getElementById('post-summary').innerText = post.summary;
        } else {
          document.getElementById('post-summary').classList.add('hidden');
        }

        document.getElementById('post-body').innerHTML = renderMarkdown(post.content || '');
        document.getElementById('post-content-area').classList.remove('hidden');
      } catch (e) {
        console.error(e);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error-box').classList.remove('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', initDetail);
  </script>
</body>
</html>
